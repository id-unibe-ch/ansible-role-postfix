---
- name: Verify the Postfix server converged to the role defaults.
  hosts: all
  gather_facts: true

  tasks:
    - name: Postfix-ldap package is installed
      ansible.builtin.package:
        name: postfix-ldap
        state: present
      check_mode: true
      register: package
      failed_when: package is changed
      when: not (ansible_os_family == 'RedHat' and ansible_distribution_major_version == '7')

    - name: Default SMTP TLS certificate path is configured
      ansible.builtin.command:
        argv:
          - postconf
          - -h
          - smtpd_tls_cert_file
      register: smtpd_tls_cert_file
      changed_when: false
      failed_when: smtpd_tls_cert_file.stdout != ('/etc/ssl/certs/ssl-cert-snakeoil.pem' if ansible_os_family == 'Debian' else '/etc/pki/tls/certs/postfix.pem')

    - name: Default SMTP TLS key path is configured
      ansible.builtin.command:
        argv:
          - postconf
          - -h
          - smtpd_tls_key_file
      register: smtpd_tls_key_file
      changed_when: false
      failed_when: smtpd_tls_key_file.stdout != ('/etc/ssl/private/ssl-cert-snakeoil.key' if ansible_os_family == 'Debian' else '/etc/pki/tls/private/postfix.key')

    - name: SMTP relay restrictions prevent unauthorized relaying
      ansible.builtin.command:
        argv:
          - postconf
          - -x
          - -h
          - smtpd_relay_restrictions
      register: smtpd_relay_restrictions
      changed_when: false
      failed_when: smtpd_relay_restrictions.stdout | regex_replace('[, ]+', ' ') | trim != 'permit_mynetworks permit_sasl_authenticated defer_unauth_destination'

    - name: Inbound SMTP TLS remains opportunistic
      ansible.builtin.command:
        argv:
          - postconf
          - -h
          - smtpd_tls_security_level
      register: smtpd_tls_security_level
      changed_when: false
      failed_when: smtpd_tls_security_level.stdout != 'may'

    - name: Outbound SMTP TLS remains opportunistic
      ansible.builtin.command:
        argv:
          - postconf
          - -h
          - smtp_tls_security_level
      register: smtp_tls_security_level
      changed_when: false
      failed_when: smtp_tls_security_level.stdout != 'may'

    - name: Ubuntu 26.04 uses Postfix compatibility level 3.10
      ansible.builtin.command:
        argv:
          - postconf
          - -h
          - compatibility_level
      register: compatibility_level
      changed_when: false
      failed_when: compatibility_level.stdout != '3.10'
      when:
        - ansible_distribution == 'Ubuntu'
        - ansible_distribution_version is version('26.04', '==')

    - name: Option myhostname defaults to ansible_fqdn
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^myhostname = mail.test"
        state: absent
      check_mode: true
      register: myhostname
      changed_when: false
      failed_when: not myhostname.found

    - name: Option mydomain defaults to test
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^mydomain = test"
        state: absent
      check_mode: true
      register: mydomain
      changed_when: false
      failed_when: mydomain is changed

    - name: Option myorigin defaults to not set
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^myorigin ="
        state: absent
      check_mode: true
      register: myorigin
      changed_when: false
      failed_when: myorigin.found | bool

    - name: Option mydestination defaults to expected default value
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^mydestination = \\$myhostname, localhost.\\$mydomain, localhost"
        state: absent
      check_mode: true
      register: mydestination
      changed_when: false
      failed_when: not mydestination.found | bool

    - name: Option inet_interfaces defaults to all
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^inet_interfaces = all"
        state: absent
      check_mode: true
      register: inet_interfaces
      changed_when: false
      failed_when: not inet_interfaces.found | bool

    - name: Option inet_protocols defaults to all
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^inet_protocols = all"
        state: absent
      check_mode: true
      register: inet_protocols
      changed_when: false
      failed_when: not inet_protocols.found | bool

    - name: No relay host is set
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^relayhost ="
        state: absent
      check_mode: true
      register: relayhost
      failed_when: relayhost is changed

    - name: No mail alias for user root
      ansible.builtin.lineinfile:
        path: /etc/aliases
        regexp: "^root:"
        state: absent
      check_mode: true
      register: aliases
      failed_when: aliases is changed

    - name: No sender_canonical file is present
      ansible.builtin.file:
        path: /etc/postfix/sender_canonical
        state: absent
      check_mode: true
      register: sender_canonical
      failed_when: sender_canonical is changed

    - name: Parameter sender_canonical_maps is not set
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^sender_canonical_maps"
        state: absent
      check_mode: true
      register: sender_canonical_maps
      failed_when: sender_canonical_maps.found | bool

    - name: Postfix service is running
      ansible.builtin.wait_for:
        port: 25
        timeout: 30
      register: port_check
      failed_when: port_check.failed
